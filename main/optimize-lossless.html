<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="head-title">可逆圧縮の最適化 - Search3958</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- SEO Meta Tags -->
  <meta name="description" id="meta-desc" content="ブラウザ上で動作する高速な画像最適化ツール。画質を変えずにファイルサイズを軽量化。メタデータの削除や効率的な圧縮でWebサイトの高速化を支援。">
  <link rel="canonical" href="https://search3958.github.io/namu/main/optimize-lossless.html">
  <meta property="og:title" id="og-title" content="可逆圧縮の最適化 - Search3958">
  <meta property="og:description" id="og-desc" content="ブラウザ上で動作する高速な画像最適化ツール。見た目を変えずにファイルサイズを数％軽量化。プライバシー保護と軽量化を同時に。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://search3958.github.io/namu/main/optimize-lossless.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#30313e">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json" id="t-jsonld"></script>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1 id="t-title">可逆圧縮の最適化</h1>
      <div class="site-links">
        <a href="https://search3958.github.io">search3958.github.io</a>
        <a href="https://search3958.github.io/policies/">利用規約とプライバシーポリシー</a>
        <a id="langLink" href="#">Language</a>
      </div>
    </header>

    <div class="top">
      <div class="card fit-content" style="flex: 1;padding:8px;">
        <div id="dropZone" class="drop-zone">
          <p id="t-dropMain">画像をドラッグ＆ドロップ</p>
          <p id="t-dropSub" style="font-size: 0.8rem;">またはクリックして選択</p>
          <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
        </div>
      </div>
      
      <div class="card fit-content">
        <form id="convertForm" class="fit-content">
          <fieldset class="fit-content">
            <legend id="t-outputFormat">出力形式</legend>
            <input type="radio" id="m1" name="method" value="auto" checked>
            <label for="m1">形式を維持</label>
            <input type="radio" id="m2" name="method" value="image/webp">
            <label for="m2">WebPに変換 (推奨)</label>
          </fieldset>
        </form>
      </div>
    </div>

    <div class="controls-row">
      <div class="switch-container">
        <span id="t-autoUpdate">自動更新</span>
        <label class="switch">
          <input type="checkbox" id="autoUpdateToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <button id="manualUpdateBtn" class="btn-small t-applyAll">最適化を実行</button>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="results-header">
        <h2 id="t-results">変換結果</h2>
        <div class="bulk-actions">
          <button id="zipBtn" class="btn-small">一括ZIPダウンロード</button>
        </div>
      </div>
      <div id="resultsList" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
    </div>
  </div>

  <script>
    const translations = {
        ja: {
            langCode: "ja",
            title: "可逆圧縮の最適化 - Search3958",
            desc: "ブラウザ上で動作する高速な画像最適化ツール。画質を変えずにファイルサイズを軽量化。メタデータの削除や効率的な圧縮でWebサイトの高速化を支援。",
            dropMain: "画像をドラッグ＆ドロップ",
            dropSub: "またはクリックして選択",
            outputFormat: "出力形式",
            autoUpdate: "自動更新",
            applyAll: "最適化を実行",
            results: "変換結果",
            lang: "Language / 言語",
            converting: "最適化中..."
        },
        en: {
            langCode: "en",
            title: "Lossless Optimization - Search3958",
            desc: "Fast in-browser image optimization tool. Reduce file size without losing quality. Support web performance by stripping metadata.",
            dropMain: "Drag & Drop Images",
            dropSub: "or click to select",
            outputFormat: "Output Format",
            autoUpdate: "Auto Update",
            applyAll: "Optimize",
            results: "Results",
            lang: "Language",
            converting: "Optimizing..."
        }
    };

    const currentLang = localStorage.getItem('selectedLang') || 'ja';
    const t = translations[currentLang] || translations.ja;

    document.documentElement.lang = t.langCode;
    document.title = t.title;
    document.getElementById('meta-desc').content = t.desc;
    
    document.getElementById('t-title').innerText = currentLang === 'ja' ? '可逆圧縮の最適化' : t.title.split(' - ')[0];
    document.getElementById('t-dropMain').innerText = t.dropMain;
    document.getElementById('t-dropSub').innerText = t.dropSub;
    document.getElementById('t-outputFormat').innerText = t.outputFormat;
    document.getElementById('t-autoUpdate').innerText = t.autoUpdate;
    document.querySelectorAll('.t-applyAll').forEach(el => el.innerText = t.applyAll);
    document.getElementById('t-results').innerText = t.results;
    document.getElementById('langLink').innerText = t.lang;

    const nextUrl = encodeURIComponent(window.location.href);
    document.getElementById('langLink').href = `https://search3958.github.io/accounts/lang?next=${nextUrl}`;

    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const resultsSection = document.getElementById('resultsSection');
    const resultsList = document.getElementById('resultsList');
    const zipBtn = document.getElementById('zipBtn');
    const manualUpdateBtn = document.getElementById('manualUpdateBtn');
    const autoUpdateToggle = document.getElementById('autoUpdateToggle');
    const form = document.getElementById('convertForm');
    
    let originalFiles = []; 
    let processedResults = [];
    let isProcessing = false;

    dropZone.addEventListener('click', () => imageInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      addFiles(e.dataTransfer.files);
    });
    imageInput.addEventListener('change', (e) => addFiles(e.target.files));

    form.addEventListener('change', () => {
      if (autoUpdateToggle.checked) reprocessAll();
    });
    manualUpdateBtn.onclick = () => reprocessAll();

    function setProcessing(val) {
        isProcessing = val;
        manualUpdateBtn.disabled = val;
        manualUpdateBtn.innerText = val ? t.converting : t.applyAll;
    }

    async function addFiles(files) {
      const newFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if (newFiles.length === 0) return;
      setProcessing(true);
      originalFiles.push(...newFiles);
      await reprocessAll();
      setProcessing(false);
    }

    async function reprocessAll() {
      if (originalFiles.length === 0) return;
      setProcessing(true);
      processedResults = [];
      resultsList.innerHTML = '';
      
      const mode = form.method.value;

      for (const file of originalFiles) {
        const format = mode === 'auto' ? file.type : mode;
        const ext = format.split('/')[1];
        const result = await optimizeImage(file, format, ext);
        processedResults.push(result);
        renderSingleResult(result);
      }
      
      setProcessing(false);
      updateGlobalUI();
    }

    async function optimizeImage(file, format, ext) {
      return new Promise(r => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            // WebP/JPEG allow quality control. PNG is lossless via canvas.
            const quality = format === 'image/png' ? undefined : 0.95;
            
            canvas.toBlob(blob => {
              const name = `opt_${file.name.split('.')[0]}.${ext}`;
              const url = URL.createObjectURL(blob);
              const ratio = ((1 - blob.size / file.size) * 100).toFixed(1);
              r({ name, blob, url, type: format, originalSize: file.size, ratio });
            }, format, quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderSingleResult(data) {
      const item = document.createElement('div');
      item.className = 'result-item';
      const isPlus = data.ratio < 0;
      item.innerHTML = `
        <img src="${data.url}" style="max-height: 80px; width: auto;">
        <div class="result-info">
          <div class="result-name">${data.name}</div>
          <div class="result-meta">
            ${(data.originalSize / 1024).toFixed(1)} KB → <strong>${(data.blob.size / 1024).toFixed(1)} KB</strong>
            <span class="ratio-badge ${isPlus ? 'plus' : ''}">${isPlus ? '+' : '-'}${Math.abs(data.ratio)}%</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn-small dl-btn">保存</button>
        </div>
      `;
      item.querySelector('.dl-btn').onclick = () => {
        const a = document.createElement('a');
        a.href = data.url; a.download = data.name; a.click();
      };
      resultsList.appendChild(item);
    }

    function updateGlobalUI() {
      resultsSection.style.display = processedResults.length > 0 ? 'flex' : 'none';
      zipBtn.style.display = processedResults.length > 1 ? 'block' : 'none';
    }

    zipBtn.onclick = async () => {
      const zip = new JSZip();
      processedResults.forEach(f => zip.file(f.name, f.blob));
      const content = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(content); a.download = 'optimized_images.zip'; a.click();
    };
  </script>
</body>
</html>
