<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="head-title">WebPアニメーションからGIF変換 - Image Optimizer Pro</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- SEO Meta Tags -->
  <meta name="description" id="meta-desc" content="ブラウザ上で動作する高速なWebPアニメーションからGIFへの変換ツール。動くWebP画像を一括でGIF形式に変換。プライバシーに配慮したオフライン処理。">
  <link rel="canonical" href="https://search3958.github.io/namu/main/webp-animation-to-gif.html">
  <meta property="og:title" id="og-title" content="WebPアニメーションからGIF変換 - Image Optimizer Pro">
  <meta property="og:description" id="og-desc" content="ブラウザ上で動作する高速な動くWebPからGIFへの変換ツール。一括変換、ZIPダウンロード対応。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://search3958.github.io/namu/main/webp-animation-to-gif.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#30313e">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json" id="t-jsonld"></script>

  <link rel="stylesheet" href="style.css">
  <script src="main.js"></script>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1 id="t-title">WebPアニメからGIF変換</h1>
      <div class="site-links">
        <a href="https://search3958.github.io">search3958.github.io</a>
        <a href="https://search3958.github.io/policies/">利用規約とプライバシーポリシー</a>
        <a id="langLink" href="#">Language</a>
      </div>
    </header>

    <div class="top">
      <div class="card fit-content" style="flex: 1;padding:8px;">
        <div id="dropZone" class="drop-zone">
          <p id="t-dropMain">WebPをドラッグ＆ドロップ</p>
          <p id="t-dropSub" style="font-size: 0.8rem;">またはクリックして選択</p>
          <input type="file" id="imageInput" accept="image/webp" multiple style="display:none">
        </div>
      </div>
    </div>

    <div class="results-section" id="resultsSection">
      <div class="results-header">
        <h2 id="t-results">変換結果</h2>
      </div>
      <div id="resultsList" style="display: flex; flex-direction: column; gap: 12px; width: 100%;"></div>
    </div>
  </div>

  <script>
    const translations = {
        ja: {
            langCode: "ja",
            title: "WebPアニメーションからGIF変換 - Image Optimizer Pro",
            desc: "ブラウザ上で動作する高速なWebPアニメーションからGIFへの変換ツール。動くWebP画像を一括でGIF形式に変換。",
            dropMain: "WebPをドラッグ＆ドロップ",
            dropSub: "またはクリックして選択",
            results: "変換結果",
            lang: "Language / 言語",
            converting: "処理中..."
        },
        en: {
            langCode: "en",
            title: "Animated WebP to GIF - Image Optimizer Pro",
            desc: "Fast in-browser Animated WebP to GIF conversion tool. Convert moving WebP images to GIF format.",
            dropMain: "Drag & Drop WebP",
            dropSub: "or click to select",
            results: "Results",
            lang: "Language",
            converting: "Processing..."
        }
    };

    const currentLang = localStorage.getItem('selectedLang') || 'ja';
    const t = translations[currentLang] || translations.ja;

    document.documentElement.lang = t.langCode;
    document.title = t.title;
    document.getElementById('meta-desc').content = t.desc;
    
    document.getElementById('t-title').innerText = currentLang === 'ja' ? 'WebPアニメからGIF変換' : t.title.split(' - ')[0];
    document.getElementById('t-dropMain').innerText = t.dropMain;
    document.getElementById('t-dropSub').innerText = t.dropSub;
    document.getElementById('t-results').innerText = t.results;
    document.getElementById('langLink').innerText = t.lang;

    const nextUrl = encodeURIComponent(window.location.href);
    document.getElementById('langLink').href = `https://search3958.github.io/accounts/lang?next=${nextUrl}`;

    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const resultsSection = document.getElementById('resultsSection');
    const resultsList = document.getElementById('resultsList');
    
    let originalFiles = []; 

    dropZone.addEventListener('click', () => imageInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      addFiles(e.dataTransfer.files);
    });
    imageInput.addEventListener('change', (e) => addFiles(e.target.files));

    async function addFiles(files) {
      const newFiles = Array.from(files).filter(f => f.type === 'image/webp');
      if (newFiles.length === 0) return;
      originalFiles.push(...newFiles);
      await reprocessAll();
    }

    async function reprocessAll() {
      if (originalFiles.length === 0) return;
      resultsList.innerHTML = '';
      
      for (const file of originalFiles) {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="result-info">
            <div class="result-name">${file.name}</div>
            <div class="result-meta">変換の準備ができました</div>
          </div>
          <div class="actions">
            <button class="btn-small dl-btn">変換して保存</button>
          </div>
        `;
        resultsList.appendChild(item);
      }
      resultsSection.style.display = 'flex';
    }
  </script>
</body>
</html>
