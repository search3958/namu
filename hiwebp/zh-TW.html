  <script>
    (function() {
      try {
        const url = new URL(window.location.href);
        const pathParts = url.pathname.split('/');
        if (pathParts.length > 0) {
          const currentFile = pathParts[pathParts.length - 1] || '';
          const canonical = document.getElementById('canonical-url');
          if (canonical) canonical.href = url.toString().replace(/[?#].*$/, '');
          const ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.content = url.toString().replace(/[?#].*$/, '');
          const langs = ['ja','en','zh-CN','zh-TW','ko','ko-KP'];
          for (const lang of langs) {
            const clone = [...pathParts];
            if (/\.html$/i.test(currentFile)) {
              clone[clone.length - 1] = `${lang}.html`;
            } else if (currentFile && WC_SUPPORTED_LANGUAGES.includes(currentFile)) {
              clone[clone.length - 1] = `${lang}.html`;
            } else {
              clone.push(`${lang}.html`);
            }
            const href = url.origin + clone.join('/');
            const link = document.getElementById('hreflang-' + lang);
            if (link) link.href = href;
          }
        }
      } catch (e) {}
    })();
  </script>
