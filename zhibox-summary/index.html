<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhibox 要約</title>
  <meta name="description" content="利用規約や個人情報処理政策をAIで要約します">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CDN: 数式 / コードハイライト -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="./" class="brand">
      <img src="zhibox-summary-logo.svg" alt="Zhibox 要約" class="logo" width="174" height="35">
    </a>
    <div class="auth">
      <button id="login-btn" class="pill-btn" type="button">ログイン</button>
      <button id="logout-btn" class="pill-btn" type="button" hidden>ログアウト</button>
    </div>
  </header>

  <main class="panel">

    <section class="hero">
      <h1>何かお手伝いできますか？</h1>
      <p class="sub">利用規約や個人情報処理政策を要約します</p>
    </section>

    <div class="mode-tabs" role="tablist" aria-label="入力方法">
      <button class="mode-tab active" type="button" role="tab" data-mode="text" aria-selected="true">直接入力</button>
      <button class="mode-tab" type="button" role="tab" data-mode="url" aria-selected="false">URLから (Beta)</button>
    </div>

    <div class="composer">
      <input id="url-input" class="composer-input" type="url" placeholder="要約したいページのURLを貼り付け" inputmode="url" autocomplete="off" hidden>
<textarea id="text-input" class="composer-input" rows="3" placeholder="利用規約や文章を貼り付け"></textarea>
      <div class="composer-foot">
        <span id="char-counter" class="counter" hidden></span>
        <button id="send-btn" class="send-btn" type="button" aria-label="要約する">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M12 19V5M5.5 11.5L12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <p id="usage" class="usage"></p>
    <p id="status" class="status" aria-live="polite"></p>
    <p id="error" class="error" role="alert"></p>

    <section id="result" class="result" hidden>
      <div class="result-actions">
        <button id="copy-btn" class="text-btn" type="button">コピー</button>
        <button id="download-btn" class="text-btn" type="button">.md保存</button>
      </div>
      <p id="result-notice" class="notice" hidden></p>
      <article id="result-body" class="markdown-body"></article>
    </section>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6151036058675874"
     crossorigin="anonymous"></script>
<!-- namu-tools -->
<ins class="adsbygoogle"
     style="display:block"

     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
  </main>
  

  <!-- CDN: Markdown / サニタイズ / 数式 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>

  <!-- 0F8 アカウントのクライアント（ログイン） -->

  <script src="app.js"></script>
  <script src="https://search3958.github.io/check.js"></script>
</body>
</html>
