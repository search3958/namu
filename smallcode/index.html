<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Code Optimizer (Stable)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>
  <style>
    :root{--md-sys-color-surface:#fef7ff;--md-sys-color-on-surface:#1d1b20;--md-sys-color-surface-container:#f3edf7;--md-sys-color-primary:#6750a4;--md-sys-color-secondary:#625b71;--md-sys-color-outline-variant:#cac4d0;--md-sys-color-tertiary:#7d5260}@media (prefers-color-scheme:dark){:root{--md-sys-color-surface:#141218;--md-sys-color-on-surface:#e6e1e5;--md-sys-color-surface-container:#211f26;--md-sys-color-primary:#d0bcff;--md-sys-color-secondary:#ccc2dc;--md-sys-color-outline-variant:#49454f;--md-sys-color-tertiary:#efb8c8}}*{font-family:'Google Sans Flex',sans-serif;margin:0;padding:0;box-sizing:border-box;user-select:none}body{width:100vw;height:100vh;background-color:var(--md-sys-color-surface);display:flex;justify-content:center;align-items:center;overflow:hidden;transition:background-color 0.3s ease}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}.watch-container{position:relative;width:90vw;height:90vh;max-width:600px;max-height:600px;background-color:var(--md-sys-color-surface-container);border-radius:100px;display:flex;justify-content:center;align-items:center;transition:background-color 0.3s ease}.watch-face{position:relative;width:100%;height:100%}.tick{position:absolute;background:var(--md-sys-color-outline-variant);border-radius:100px;transform-origin:center}.tick.major{background:var(--md-sys-color-secondary);width:4px !important}.number{position:absolute;font-size:8vh;font-weight:500;color:var(--md-sys-color-on-surface);transform:translate(-50%,-50%);font-variation-settings:"wght" 450,"wdth" 100}.digital-time{position:absolute;left:50%;top:65%;transform:translateX(-50%);font-size:2.5vh;font-weight:500;color:var(--md-sys-color-secondary);letter-spacing:1px}.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:100px;z-index:10}.hour-hand{width:12px;background:var(--md-sys-color-on-surface);margin-left:-6px}.minute-hand{width:8px;background:var(--md-sys-color-secondary);margin-left:-4px}.second-hand{width:3px;background:var(--md-sys-color-tertiary);margin-left:-1.5px;z-index:20}.center-dot{position:absolute;top:50%;left:50%;width:32px;height:32px;background:#694c81;border-radius:50%;transform:translate(-50%,-50%);z-index:30}img.logo{position:absolute;top:50%;left:50%;width:24px;height:24px;transform:translate(-50%,-50%);z-index:31;filter:grayscale(1) brightness(1);mix-blend-mode:color-dodge;cursor:pointer}@media (prefers-color-scheme:dark){img.logo{filter:grayscale(1) contrast(0.2) brightness(1.7)}}
  </style>
</head>

<body>
<h2>コード最小化・整形ツール</h2>
  <div class="container">
    <div class="controls">
      <div class="group" style="grid-area: 1 / 1 / 2 / 2;">
        <label><input type="radio" name="lang" value="html" checked><span>HTML</span></label>
        <label><input type="radio" name="lang" value="css"><span>CSS</span></label>
        <label><input type="radio" name="lang" value="js"><span>JS</span></label>
      </div>
      <div class="group" style="grid-area: 1 / 2 / 2 / 3;">
        <label><input type="radio" name="mode" value="minify" checked><span>最小化</span></label>
        <label><input type="radio" name="mode" value="beautify"><span>整形</span></label>
      </div>
      <label style="font-size: 14px;grid-area: 2 / 1 / 3 / 3;"><input type="checkbox" id="autoUpdate" checked> Auto Update</label>
    </div>
    <textarea id="input" placeholder="コードを貼り付けてください"></textarea>
    <div class="action-bar">
      <button id="runBtn">結果を更新</button>
    </div>
    <div id="output"></div>
  </div>

  <div id="toast">コピーしました！</div>

  <script>
    const inputArea = document.getElementById('input');const outputArea = document.getElementById('output');const runBtn = document.getElementById('runBtn');const autoUpdateCheck = document.getElementById('autoUpdate');const toast = document.getElementById('toast');const reg ={spaces:new RegExp('\\s+','g'),comments:new RegExp('\\/\\*[\\s\\S]*?\\*\\/','g'),htmlComments:new RegExp('','g'),cssClean:new RegExp('\\s*([\\{\\};:,])\\s*','g')};function doMinify(code,lang){if(!code)return "";let res = code;if(lang === 'html'){res = res.replace(reg.htmlComments,'');res = res.replace(/\r?\n|\r/g,' ');res = res.replace(reg.spaces,' ');res = res.replace(/>\s+</g,'><');return res.trim();}if(lang === 'css'){res = res.replace(reg.comments,'');res = res.replace(reg.cssClean,'$1');res = res.replace(reg.spaces,' ');return res.trim();}if(lang === 'js'){res = res.replace(reg.comments,'');res = res.replace(/\/\/.*/g,'');res = res.replace(/\s+/g,' ');return res.trim();}return res;}function process(){const code = inputArea.value;const lang = document.querySelector('input[name="lang"]:checked').value;const mode = document.querySelector('input[name="mode"]:checked').value;try{if(mode === 'beautify'){if(lang === 'html')outputArea.textContent = html_beautify(code,{indent_size:2});if(lang === 'css')outputArea.textContent = css_beautify(code,{indent_size:2});if(lang === 'js')outputArea.textContent = js_beautify(code,{indent_size:2});}else{outputArea.textContent = doMinify(code,lang);}}catch(e){outputArea.textContent = "Error:" + e.message;}}inputArea.addEventListener('input',()=>{if(autoUpdateCheck.checked)process();});document.querySelectorAll('input').forEach(el => el.addEventListener('change',()=>{if(autoUpdateCheck.checked)process();}));runBtn.addEventListener('click',process);outputArea.addEventListener('click',()=>{const text = outputArea.textContent;if(!text || text.startsWith("Error:"))return;navigator.clipboard.writeText(text).then(()=>{toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');},2000);});});
  </script>
</body>

</html>
